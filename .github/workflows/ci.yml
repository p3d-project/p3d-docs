name: CI

on:
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'src/content/**'

jobs:
  astro-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7

      - name: Install dependencies
        run: pnpm ci

      - name: Run check
        run: pnpm run check

  pretty-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7

      - name: Install dependencies
        run: pnpm ci

      - name: Run check
        run: pnpm run pretty:check
