name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - master
      - prod

  pull_request:
    types:
      - opened
      - reopened
      - synchronize

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: true

      - name: Build
        run: pnpm run build

      - name: Deploy Worker
        if: github.ref == 'refs/heads/prod'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --tag="${{ github.ref_name }}"

      - name: Deploy Staging Worker
        if: github.ref == 'refs/heads/master'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: versions upload --tag="${{ github.ref_name }}" --preview-alias="staging"

      - name: Deploy PR Preview Worker
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
        run: pnpm exec wrangler versions upload --tag="$PR_BRANCH" --preview-alias="pr-$PR_NUMBER" --message="$PR_TITLE"

      - name: Post PR Comment
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview Deployed!**\n\nTake a peek over at: <https://pr-${context.payload.pull_request.number}-p3d-docs.thep3dproject-a24.workers.dev/>`
            })
